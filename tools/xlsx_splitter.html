<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XLSX 按 200 行拆分工具</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        margin: 2rem auto;
        max-width: 720px;
        line-height: 1.6;
        color: #1f2937;
        padding: 0 1rem;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 1.2rem;
      }
      .row {
        margin-bottom: 1rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.4rem;
      }
      input,
      button {
        font-size: 1rem;
      }
      input[type="number"] {
        width: 100%;
        padding: 0.55rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      button {
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        padding: 0.6rem 1rem;
        cursor: pointer;
      }
      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      #log {
        margin-top: 1rem;
        white-space: pre-wrap;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 0.8rem;
        min-height: 3rem;
      }
      small {
        color: #4b5563;
      }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <h1>XLSX 按固定行数拆分</h1>
    <p>点击选择一个 <code>.xlsx</code> 文件后，自动跳过首行参与分块；并确保每个拆分文件第一行都等于原文件第一行。</p>

    <div class="card">
      <div class="row">
        <label for="fileInput">1) 点击选择 XLSX 文件（无需拖拽）</label>
        <input id="fileInput" type="file" accept=".xlsx" />
      </div>

      <div class="row">
        <label for="chunkSize">2) 每个文档的行数（默认 200）</label>
        <input id="chunkSize" type="number" value="200" min="1" />
        <small>例如原文件有 1000 行数据（不含首行），会拆成 5 个文件。</small>
      </div>

      <button id="splitBtn">开始拆分并下载</button>
      <div id="log"></div>
    </div>

    <script>
      const fileInput = document.getElementById("fileInput");
      const chunkSizeInput = document.getElementById("chunkSize");
      const splitBtn = document.getElementById("splitBtn");
      const log = document.getElementById("log");

      function logMsg(msg) {
        log.textContent = msg;
      }

      function sanitizeFileName(name) {
        return name.replace(/[\\/:*?"<>|]/g, "_");
      }

      async function splitWorkbook() {
        const file = fileInput.files?.[0];
        if (!file) {
          logMsg("请先点击并选择一个 .xlsx 文件。");
          return;
        }

        const chunkSize = Number.parseInt(chunkSizeInput.value, 10);
        if (!Number.isInteger(chunkSize) || chunkSize <= 0) {
          logMsg("每个文档行数必须是大于 0 的整数。");
          return;
        }

        splitBtn.disabled = true;
        try {
          logMsg("正在读取文件...");
          const arrayBuffer = await file.arrayBuffer();
          const wb = XLSX.read(arrayBuffer, { type: "array" });

          if (!wb.SheetNames.length) {
            throw new Error("文件中没有工作表。");
          }

          const wsName = wb.SheetNames[0];
          const ws = wb.Sheets[wsName];
          const rows = XLSX.utils.sheet_to_json(ws, {
            header: 1,
            defval: "",
            blankrows: false,
          });

          if (rows.length <= 1) {
            throw new Error("数据不足：除了第一行外没有可拆分的数据。");
          }

          const header = rows[0];
          const dataRows = rows.slice(1);
          const totalDocs = Math.ceil(dataRows.length / chunkSize);

          logMsg(`共 ${dataRows.length} 行数据，将生成 ${totalDocs} 个文档...`);

          for (let i = 0; i < totalDocs; i++) {
            const start = i * chunkSize;
            const end = start + chunkSize;
            const chunk = dataRows.slice(start, end);
            const outData = [header, ...chunk];

            const outWb = XLSX.utils.book_new();
            const outWs = XLSX.utils.aoa_to_sheet(outData);
            XLSX.utils.book_append_sheet(outWb, outWs, "Sheet1");

            const fileBaseName = sanitizeFileName(file.name.replace(/\.xlsx$/i, ""));
            const outFile = `${fileBaseName}_part_${String(i + 1).padStart(2, "0")}.xlsx`;
            XLSX.writeFile(outWb, outFile);
          }

          logMsg(`完成！已拆分并触发下载 ${totalDocs} 个文件。每个文件第一行都与原始第一行一致。`);
        } catch (error) {
          logMsg(`处理失败：${error.message}`);
        } finally {
          splitBtn.disabled = false;
        }
      }

      splitBtn.addEventListener("click", splitWorkbook);
    </script>
  </body>
</html>
